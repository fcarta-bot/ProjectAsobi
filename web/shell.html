<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- Pagina del gioco per browser e iPad. Emscripten mette lo script del gioco al posto di SCRIPT -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- "Aggiungi alla schermata Home" su iPad: si apre a tutto schermo, come un'app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asobi">
<meta name="theme-color" content="#000000">
<title>ProjectAsobi</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; outline: none; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #07070c; color: #fff; font: 600 20px -apple-system, system-ui, sans-serif; text-align: center; gap: 14px;
  }
  .overlay h1 { margin: 0; font-size: 44px; letter-spacing: 2px; color: #f5c542; }
  .overlay p { margin: 0; opacity: .75; font-weight: 400; max-width: 30em; padding: 0 16px; }
  #start { cursor: pointer; }
  #start[hidden], #rotate[hidden] { display: none; }
  /* L'iPad dritto e' troppo stretto per il gioco: chiede di girarlo */
  #rotate { display: none; z-index: 10; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<div id="start" class="overlay">
  <h1>ProjectAsobi</h1>
  <p id="status">Caricamento...</p>
</div>
<div id="rotate" class="overlay">
  <h1>&#8635;</h1>
  <p>Gira l'iPad in orizzontale per giocare</p>
</div>

<script>
  var startEl = document.getElementById('start');
  var statusEl = document.getElementById('status');

  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) { if (text) statusEl.textContent = 'Caricamento...'; },
    onRuntimeInitialized: function () {
      statusEl.textContent = 'Tocca lo schermo per iniziare';
      // Il primo tocco serve al browser per concedere lo schermo intero
      startEl.addEventListener('click', function () {
        var c = document.documentElement;
        var full = c.requestFullscreen || c.webkitRequestFullscreen;
        if (full) { try { var p = full.call(c); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        startEl.hidden = true;
        Module.canvas.focus();
      }, { once: true });
    }
  };

  // Niente zoom con due dita o doppio tocco, niente "rimbalzo" della pagina
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('error', function () { statusEl.textContent = 'Errore nel caricamento del gioco'; });
</script>
{{{ SCRIPT }}}
</body>
</html>
